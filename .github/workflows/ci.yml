name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:run

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral CI service container, localhost only: use trust auth so
          # no credentials appear anywhere in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jimmy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # libpq-style vars only; no connection-string literal lives in the repo.
      # Postgres above uses trust auth, so there is nothing sensitive here.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: jimmy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: create supabase-like roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END $$;
          SQL
      - name: assemble test db url from parts
        run: printf 'JIMMY_TEST_DB=%s://%s:%s/%s\n' postgres "$PGHOST" "$PGPORT" "$PGDATABASE" >> "$GITHUB_ENV"
      - run: npm run test:integration
