# Throwaway Postgres for jimmy's integration tests.
#
#   docker compose -f docker-compose.test.yml up -d
#   JIMMY_TEST_DB=postgres://postgres@localhost:55432/jimmy_test npm run test:integration
#   docker compose -f docker-compose.test.yml down -v
#
# Port 55432 avoids colliding with a local Postgres on 5432. The container is
# ephemeral: no volume is mounted, so `down` wipes everything.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Throwaway local container: trust auth, no credentials to leak.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: jimmy_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    # roles the integration suite expects, created on first boot
    command: >
      postgres -c log_statement=none
